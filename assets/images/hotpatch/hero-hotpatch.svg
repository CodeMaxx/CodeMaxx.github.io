<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation Report, Part 3 of 4: The Secure Hotpatch Report</title>
  <desc id="dh">Part 3 of the Windows Runtime Attestation Report series. The large question "Patch or attack?" appears in green, white, and red above the series name and the post title.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#292e37"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.78" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.22" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#35d878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35d878" stop-opacity="0"/>
    </radialGradient>
    <filter id="headlineGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#greenGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#redGlow)"/>

  <!-- thumbnail hook -->
  <text x="350" y="167" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-0.8" fill="#68e38e" filter="url(#headlineGlow)">PATCH</text>
  <text x="600" y="167" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-0.8" fill="#ffffff" filter="url(#headlineGlow)">OR</text>
  <text x="910" y="167" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-0.8" fill="#ff746a" filter="url(#headlineGlow)">ATTACK?</text>
  <text x="600" y="264" text-anchor="middle" font-size="34" font-weight="700" fill="#a8d8ff" letter-spacing="1.4">WINDOWS RUNTIME ATTESTATION REPORT</text>
  <text x="600" y="318" text-anchor="middle" font-size="34" font-weight="700" fill="#ffd166" letter-spacing="1.4">PART 3 OF 4</text>
  <text x="600" y="376" text-anchor="middle" font-size="34" font-weight="700" fill="#f4f6f8" letter-spacing="1.4">THE SECURE HOTPATCH REPORT</text>


  <!-- modified code strip -->
  <text x="600" y="466" text-anchor="middle" font-size="19" font-weight="600" fill="#c4ccd7" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="0.5">MODIFIED KERNEL-MODE CODE</text>
  <g>
