      <rect x="658" y="494" width="20" height="30" rx="3"/>
      <rect x="683" y="494" width="36" height="30" rx="3"/>
      <rect x="724" y="494" width="24" height="30" rx="3"/>
      <rect x="753" y="494" width="42" height="30" rx="3"/>
      <rect x="800" y="494" width="18" height="30" rx="3"/>
      <rect x="823" y="494" width="32" height="30" rx="3"/>
      <rect x="860" y="494" width="28" height="30" rx="3"/>
