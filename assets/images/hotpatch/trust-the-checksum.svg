<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 900 400" width="900" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="tc dc">
  <title id="tc">Which hotpatch entry fields to trust</title>
  <desc id="dc">A HOTPATCH_INFO_ENTRY has two kinds of fields. BaseCheckSum and BaseTimeDateStamp are the authoritative identity: they come from patch metadata verified inside VTL1 and arrive in a signed report. BaseImageName is informational only: it is captured from VTL0 for readability and can be spoofed, so it must not be used as a key.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="mGrn" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2E9E5B"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#E8503A"/>
    </marker>
  </defs>

  <rect x="0" y="7" width="900" height="400" fill="#FBF7F1"/>
  <rect x="0" y="7" width="900" height="400" fill="url(#paper)"/>

  <text x="40" y="46" font-size="15" font-weight="700" fill="#2A2A35" font-family="'SFMono-Regular', Consolas, monospace">HOTPATCH_INFO_ENTRY</text>

  <!-- ===== The authoritative identity ===== -->
  <g filter="url(#soft)">
    <rect x="40" y="64" width="500" height="156" rx="16" fill="#E8F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  </g>
  <text x="62" y="95" font-size="14.5" font-weight="700" fill="#2E7D4F">Trust these: the real identity</text>
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" fill="#2A2A35">
    <rect x="62" y="108" width="224" height="32" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
    <text x="78" y="129">BaseCheckSum</text>
    <rect x="62" y="150" width="224" height="32" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
    <text x="78" y="171">BaseTimeDateStamp</text>
  </g>
  <text x="62" y="205" font-size="12.5" fill="#6B6B7B">From the signed patch, verified in VTL1.</text>

  <!-- ===== The convenience label ===== -->
  <g filter="url(#soft)">
    <rect x="40" y="244" width="500" height="124" rx="16" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  </g>
  <text x="62" y="275" font-size="14.5" font-weight="700" fill="#C8402F">Don't key on this: just a label</text>
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" fill="#2A2A35">
    <rect x="62" y="288" width="224" height="32" rx="8" fill="#FFFFFF" stroke="#E8503A" stroke-width="2"/>
    <text x="78" y="309">BaseImageName</text>
  </g>
  <text x="62" y="352" font-size="12.5" fill="#6B6B7B">Captured from VTL0 for readability. Spoofable.</text>

  <!-- ===== Where each one comes from ===== -->
  <g filter="url(#soft)">
    <rect x="620" y="104" width="240" height="78" rx="14" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <g transform="translate(638,124)">
    <rect x="0" y="8" width="17" height="13" rx="3" fill="#2E5AA8"/>
    <path d="M2.6,8 V5.8 a5.9,5.9 0 0 1 11.8,0 V8" fill="none" stroke="#2E5AA8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="8.5" cy="14.5" r="2" fill="#EAF6FB"/>
  </g>
  <text x="748" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#2E5AA8">VTL1 (Secure Kernel)</text>
  <text x="748" y="160" text-anchor="middle" font-size="12" fill="#6B6B7B">trusted, signed</text>

  <g filter="url(#soft)">
    <rect x="620" y="266" width="240" height="78" rx="14" fill="#FFFFFF" stroke="#8A8A98" stroke-width="2.5"/>
  </g>
  <text x="740" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6B7B">VTL0 (normal world)</text>
  <text x="740" y="322" text-anchor="middle" font-size="12" fill="#8A8A98">convenient, not trusted</text>

  <line x1="612" y1="143" x2="556" y2="143" stroke="#2E9E5B" stroke-width="2.5" marker-end="url(#mGrn)"/>
  <line x1="612" y1="305" x2="556" y2="305" stroke="#E8503A" stroke-width="2.5" marker-end="url(#mRed)"/>
</svg>
