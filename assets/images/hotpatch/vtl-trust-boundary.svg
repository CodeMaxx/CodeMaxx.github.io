<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the signed report crosses the VBS trust boundary</title>
  <desc id="d">Your process in VTL0 calls GetRuntimeAttestationReport with a nonce. The request crosses the VBS trust boundary into VTL1, where the Secure Kernel collects driver and hotpatch state, builds the report package, and signs it with the VBS key. The signed package returns to your process, which verifies the signature and reads the report. A compromised VTL0 kernel cannot forge or alter what VTL1 signs.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#186ce0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- Boundary -->
  <line x1="480" y1="40" x2="480" y2="400" stroke="#d4a72c" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="392" y="20" width="176" height="26" rx="13" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.3"/>
  <text x="480" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d1a">VBS trust boundary</text>

  <!-- Zone labels -->
  <text x="40" y="76" font-size="15" font-weight="700" fill="#57606a">VTL0: normal world</text>
  <text x="920" y="76" text-anchor="end" font-size="15" font-weight="700" fill="#186ce0">VTL1: secure world</text>

  <!-- Your process -->
  <rect x="60" y="104" width="190" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Your process</text>
  <text x="155" y="152" text-anchor="middle" font-size="12.5" fill="#57606a">(VTL0 user mode)</text>

  <!-- Secure Kernel big box -->
  <rect x="560" y="96" width="360" height="176" rx="12" fill="#eef4ff" stroke="#186ce0" stroke-width="1.6"/>
  <text x="740" y="124" text-anchor="middle" font-size="15.5" font-weight="700" fill="#186ce0">Secure Kernel</text>
  <text x="584" y="156" font-size="14" fill="#1f2328">1.  collects driver + hotpatch state</text>
  <text x="584" y="184" font-size="14" fill="#1f2328">2.  builds the report package</text>
  <text x="584" y="212" font-size="14" fill="#1f2328">3.  signs it with the IDKS private key</text>
  <g transform="translate(852,198)">
    <rect x="0" y="6" width="17" height="13" rx="2.2" fill="#186ce0"/>
    <path d="M2.5,6 V3.6 a6,6 0 0 1 12,0 V6" fill="none" stroke="#186ce0" stroke-width="2.3"/>
    <circle cx="8.5" cy="12.5" r="2" fill="#ffffff"/>
  </g>

  <!-- request arrow across boundary -->
  <line x1="250" y1="130" x2="560" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="300" y="118" font-size="12.5" fill="#57606a">request + 32-byte nonce</text>

  <!-- response arrow back -->
  <line x1="560" y1="240" x2="272" y2="322" stroke="#186ce0" stroke-width="2" marker-end="url(#a2b)"/>
  <text x="300" y="270" font-size="12.5" font-weight="600" fill="#186ce0">signed package</text>

  <!-- verify box -->
  <rect x="60" y="300" width="210" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Verify the signature,</text>
  <text x="165" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">then read the report</text>

  <text x="480" y="424" text-anchor="middle" font-size="12.5" fill="#8b949e">A compromised VTL0 kernel cannot forge or alter what VTL1 signs.</text>
</svg>
