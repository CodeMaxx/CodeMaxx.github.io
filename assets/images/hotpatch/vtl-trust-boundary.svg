<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 1 960 452" width="960" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the signed report crosses the VBS trust boundary</title>
  <desc id="d">Your process in VTL0 calls GetRuntimeAttestationReport with a nonce. The request crosses the VBS trust boundary into VTL1, where the Secure Kernel collects active hotpatch state, builds the report package, and signs it with the IDKS private key. The signed package returns to your process, which verifies the signature and reads the report. A compromised VTL0 kernel cannot forge or alter what VTL1 signs.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2A2A35"/>
    </marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#3E8FBF"/>
    </marker>
  </defs>

  <rect x="8" y="1" width="960" height="452" fill="#FBF7F1"/>
  <rect x="8" y="1" width="960" height="452" fill="url(#paper)"/>

  <!-- secure side gets a faint tint so the two worlds read apart -->
  <rect x="480" y="52" width="456" height="348" rx="16" fill="#EAF6FB" opacity="0.55"/>

  <!-- ===== The boundary ===== -->
  <line x1="480" y1="52" x2="480" y2="400" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="384" y="24" width="192" height="32" rx="16" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  <text x="480" y="45" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="0.6" fill="#8A6A10">VBS trust boundary</text>

  <text x="40" y="88" font-size="15" font-weight="700" letter-spacing="0.8" fill="#6B6B7B">VTL0: normal world</text>
  <text x="920" y="88" text-anchor="end" font-size="15" font-weight="700" letter-spacing="0.8" fill="#2E5AA8">VTL1: secure world</text>

  <!-- ===== Caller in VTL0 ===== -->
  <g filter="url(#soft)">
    <rect x="60" y="114" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="160" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2A35">Your process</text>
  <text x="160" y="168" text-anchor="middle" font-size="12.5" fill="#6B6B7B">(VTL0 user mode)</text>

  <!-- ===== Secure Kernel in VTL1 ===== -->
  <g filter="url(#soft)">
    <rect x="556" y="108" width="364" height="184" rx="16" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <text x="738" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2E5AA8">Secure Kernel</text>
  <text x="584" y="176" font-size="14" fill="#2A2A35">1.  collects active hotpatch state</text>
  <text x="584" y="208" font-size="14" fill="#2A2A35">2.  builds the report package</text>
  <text x="584" y="240" font-size="14" fill="#2A2A35">3.  signs it with the IDKS private key</text>
  <g transform="translate(866,224)">
    <rect x="0" y="8" width="18" height="14" rx="3" fill="#2E5AA8"/>
    <path d="M2.8,8 V5.6 a6.2,6.2 0 0 1 12.4,0 V8" fill="none" stroke="#2E5AA8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="9" cy="15" r="2.1" fill="#EAF6FB"/>
  </g>

  <!-- ===== Request crosses into VTL1 ===== -->
  <line x1="268" y1="153" x2="548" y2="153" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="394" y="139" text-anchor="middle" font-size="12.5" fill="#6B6B7B">request + 32-byte nonce</text>

  <!-- ===== Signed package returns ===== -->
  <polyline points="620,292 620,344 288,344" fill="none" stroke="#3E8FBF" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2b)"/>
  <text x="454" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2E5AA8">signed package</text>

  <!-- ===== Back in VTL0 ===== -->
  <g filter="url(#soft)">
    <rect x="60" y="306" width="220" height="76" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="170" y="337" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2A2A35">Verify the signature,</text>
  <text x="170" y="359" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2A2A35">then read the report</text>

  <text x="480" y="428" text-anchor="middle" font-size="13" fill="#8A8A98">A compromised VTL0 kernel cannot forge or alter what VTL1 signs.</text>
</svg>
