<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 1 992 512" width="992" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Deciding whether a modified byte in the kernel is a cheat or a legitimate hotpatch</title>
  <desc id="desc">An anti-cheat scanner finds modified bytes in ntoskrnl.exe. It checks the address against an attested list of hotpatched images signed by the Secure Kernel in VTL1. If the address is inside a reported hotpatched image, a legitimate Microsoft hotpatch could explain the change, though the exact bytes still aren't individually verified. Otherwise, no legitimate hotpatch explains it, and the change stays suspicious.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2A2A35"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2E9E5B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#E8503A"/>
    </marker>
  </defs>

  <rect x="-16" y="1" width="992" height="512" fill="#FBF7F1"/>
  <rect x="-16" y="1" width="992" height="512" fill="url(#paper)"/>

  <!-- ===== Attested list, signed in VTL1 ===== -->
  <g filter="url(#soft)">
    <rect x="300" y="30" width="360" height="96" rx="14" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <g transform="translate(328,52)">
    <rect x="0" y="9" width="20" height="16" rx="3.5" fill="#2E5AA8"/>
    <path d="M3.2,9 V6.2 a6.8,6.8 0 0 1 13.6,0 V9" fill="none" stroke="#2E5AA8" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="10" cy="17" r="2.4" fill="#EAF6FB"/>
  </g>
  <text x="480" y="66" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2E5AA8">Attested hotpatch list</text>
  <text x="480" y="91" text-anchor="middle" font-size="14" fill="#2A2A35">signed by the Secure Kernel (VTL1)</text>
  <text x="480" y="112" text-anchor="middle" font-size="12.5" fill="#6B6B7B">a compromised normal kernel cannot forge it</text>

  <line x1="480" y1="130" x2="480" y2="182" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== The scanner's finding ===== -->
  <g filter="url(#soft)">
    <rect x="24" y="202" width="250" height="112" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="149" y="238" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A2A35">Scanner finds</text>
  <text x="149" y="260" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A2A35">modified bytes</text>
  <text x="149" y="285" text-anchor="middle" font-size="13.5" fill="#6B6B7B">a function in</text>
  <text x="149" y="305" text-anchor="middle" font-size="14" font-family="'SFMono-Regular', Consolas, monospace" fill="#C8402F">ntoskrnl.exe</text>

  <line x1="282" y1="258" x2="348" y2="258" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== The decision ===== -->
  <g filter="url(#soft)">
    <polygon points="480,188 606,258 480,328 354,258" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="480" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2A35">Address inside an</text>
  <text x="480" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2A35">attested hotpatched</text>
  <text x="480" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2A35">image?</text>

  <!-- ===== YES ===== -->
  <polyline points="606,258 664,258 664,402 686,402" fill="none" stroke="#2E9E5B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <text x="674" y="250" text-anchor="start" font-size="13.5" font-weight="700" letter-spacing="1.2" fill="#2E7D4F">YES</text>

  <g filter="url(#soft)">
    <rect x="690" y="360" width="246" height="86" rx="14" fill="#E8F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  </g>
  <text x="813" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D4F">Inside hotpatched image</text>
  <text x="813" y="413" text-anchor="middle" font-size="13.5" fill="#2A2A35">a patch could explain it,</text>
  <text x="813" y="432" text-anchor="middle" font-size="13.5" fill="#2A2A35">not proof on its own</text>

  <!-- ===== NO ===== -->
  <polyline points="480,328 480,402 278,402" fill="none" stroke="#E8503A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
  <text x="492" y="366" text-anchor="start" font-size="13.5" font-weight="700" letter-spacing="1.2" fill="#C8402F">NO</text>

  <g filter="url(#soft)">
    <rect x="24" y="360" width="250" height="86" rx="14" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  </g>
  <text x="149" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#C8402F">Unattested change</text>
  <text x="149" y="413" text-anchor="middle" font-size="13.5" fill="#2A2A35">no signed patch explains it,</text>
  <text x="149" y="432" text-anchor="middle" font-size="13.5" fill="#2A2A35">definitely suspicious</text>

  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#8A8A98">The report turns an ambiguous signal into a decidable one.</text>
</svg>
