<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One signed package, several report types</title>
  <desc id="d">The runtime attestation package ties a fresh challenge and the requested reports to one Secure Kernel signature. The Windows SDK defines Driver, Hotpatch, and Code Integrity report types. This series and the sample focus on Driver and Hotpatch.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="352" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="352" fill="url(#paper)"/>

  <!-- ===== The signed outer envelope ===== -->
  <g filter="url(#soft)">
    <rect x="90" y="36" width="780" height="248" rx="16" fill="#FFFFFF" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <text x="114" y="73" font-size="16.5" font-weight="700" fill="#2E5AA8">The signed report package</text>
  <g transform="translate(612,51)">
    <rect x="0" y="0" width="234" height="34" rx="17" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
    <g transform="translate(18,9.5)">
      <rect x="0" y="6" width="15" height="11" rx="2.5" fill="#2E5AA8"/>
      <path d="M2.2,6 V3.9 a5.3,5.3 0 0 1 10.6,0 V6" fill="none" stroke="#2E5AA8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="7.5" cy="11.5" r="1.7" fill="#EAF6FB"/>
    </g>
    <text x="128" y="21.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#2E5AA8">Secure Kernel signature</text>
  </g>

  <!-- The server's challenge -->
  <rect x="114" y="106" width="168" height="152" rx="12" fill="#FFF6E0" stroke="#FFB020" stroke-width="2"/>
  <text x="198" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8A6A10">Fresh</text>
  <text x="198" y="173" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8A6A10">challenge</text>
  <text x="198" y="202" text-anchor="middle" font-size="12.5" fill="#6B6B7B">the server's</text>
  <text x="198" y="221" text-anchor="middle" font-size="12.5" fill="#6B6B7B">nonce</text>

  <!-- Driver report -->
  <rect x="302" y="106" width="168" height="152" rx="12" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2"/>
  <text x="386" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2E5AA8">Driver</text>
  <text x="386" y="173" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2E5AA8">report</text>
  <text x="386" y="202" text-anchor="middle" font-size="12.5" fill="#6B6B7B">which drivers</text>
  <text x="386" y="221" text-anchor="middle" font-size="12.5" fill="#6B6B7B">have loaded</text>

  <!-- Hotpatch report -->
  <rect x="490" y="106" width="168" height="152" rx="12" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2"/>
  <text x="574" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2E5AA8">Hotpatch</text>
  <text x="574" y="173" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2E5AA8">report</text>
  <text x="574" y="202" text-anchor="middle" font-size="12.5" fill="#6B6B7B">what's patched</text>
  <text x="574" y="221" text-anchor="middle" font-size="12.5" fill="#6B6B7B">right now</text>

  <!-- Code Integrity report type -->
  <rect x="678" y="106" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#8A8A98" stroke-width="2"/>
  <text x="762" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6B6B7B">Code Integrity</text>
  <text x="762" y="173" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6B6B7B">report type</text>
  <text x="762" y="202" text-anchor="middle" font-size="12.5" fill="#6B6B7B">defined in the</text>
  <text x="762" y="221" text-anchor="middle" font-size="12.5" fill="#6B6B7B">Windows SDK</text>

  <text x="480" y="326" text-anchor="middle" font-size="13" fill="#8A8A98">The SDK defines all three. This series and the sample focus on Driver and Hotpatch.</text>
</svg>
