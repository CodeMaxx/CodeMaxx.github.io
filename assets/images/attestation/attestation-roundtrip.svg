<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The attestation round trip</title>
  <desc id="d">Seven numbered steps, colored by who does them. Amber steps are your server, grey steps are your app in VTL0, blue steps are the Secure Kernel in VTL1. The server sends a fresh challenge, the app calls the API, the Secure Kernel builds a signed package, the app returns it, and the server verifies the package with a trusted key before applying policy.</desc>

  <rect x="0" y="0" width="960" height="578" fill="#ffffff"/>

  <g transform="translate(30,0)">
  <!-- legend -->
  <g transform="translate(100,44)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.4"/>
    <text x="24" y="13" font-size="13" fill="#57606a">your server</text>
    <rect x="150" y="0" width="16" height="16" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="174" y="13" font-size="13" fill="#57606a">your app (VTL0)</text>
    <rect x="322" y="0" width="16" height="16" rx="4" fill="#eef4ff" stroke="#186ce0" stroke-width="1.4"/>
    <text x="346" y="13" font-size="13" fill="#57606a">Secure Kernel (VTL1)</text>
  </g>

  <!-- rows -->
  <!-- row 1 server -->
  <rect x="100" y="86" width="700" height="52" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <circle cx="132" cy="112" r="15" fill="#d4a72c"/>
  <text x="132" y="117" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
  <text x="166" y="117" font-size="14.5" fill="#1f2328">Your server picks a fresh random challenge and sends it over.</text>

  <!-- row 2 app -->
  <rect x="100" y="150" width="700" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="132" cy="176" r="15" fill="#57606a"/>
  <text x="132" y="181" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
  <text x="166" y="181" font-size="14.5" fill="#1f2328">Your app calls the API with that challenge and the reports it wants.</text>

  <!-- row 3 sk -->
  <rect x="100" y="214" width="700" height="52" rx="10" fill="#eef4ff" stroke="#186ce0" stroke-width="1.5"/>
  <circle cx="132" cy="240" r="15" fill="#186ce0"/>
  <text x="132" y="245" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="166" y="245" font-size="14.5" fill="#1f2328">The Secure Kernel builds each requested report by its own rules.</text>

  <!-- row 4 sk -->
  <rect x="100" y="278" width="700" height="52" rx="10" fill="#eef4ff" stroke="#186ce0" stroke-width="1.5"/>
  <circle cx="132" cy="304" r="15" fill="#186ce0"/>
  <text x="132" y="309" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
  <text x="166" y="309" font-size="14.5" fill="#1f2328">It signs the package, folding in your challenge, and hands it back.</text>

  <!-- row 5 app -->
  <rect x="100" y="342" width="700" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="132" cy="368" r="15" fill="#57606a"/>
  <text x="132" y="373" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
  <text x="166" y="373" font-size="14.5" fill="#1f2328">Your app sends the signed package up to your server.</text>

  <!-- row 6 server -->
  <rect x="100" y="406" width="700" height="52" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <circle cx="132" cy="432" r="15" fill="#d4a72c"/>
  <text x="132" y="437" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">6</text>
  <text x="166" y="437" font-size="14.5" fill="#1f2328">Your server verifies it with a trusted key and matches the challenge.</text>

  <!-- row 7 server -->
  <rect x="100" y="470" width="700" height="52" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <circle cx="132" cy="496" r="15" fill="#d4a72c"/>
  <text x="132" y="501" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">7</text>
  <text x="166" y="501" font-size="14.5" fill="#1f2328">If both hold, it compares the facts to a baseline and applies policy.</text>

  <text x="450" y="556" text-anchor="middle" font-size="12.5" fill="#8b949e">The fresh challenge stops replay. The trusted public key is what gives the signature meaning.</text>
  </g>
</svg>
