<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The attestation round trip</title>
  <desc id="d">Seven numbered steps, colored by who does them. Amber steps are your server, grey steps are your app in VTL0, blue steps are the Secure Kernel in VTL1. The server sends a fresh challenge, the app calls the API, the Secure Kernel builds a signed package, the app returns it, and the server verifies the package with a trusted key before applying policy.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="592" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="592" fill="url(#paper)"/>

  <!-- ===== Legend ===== -->
  <rect x="130" y="32" width="16" height="16" rx="4" fill="#FFF6E0" stroke="#FFB020" stroke-width="2"/>
  <text x="154" y="45" font-size="13" fill="#6B6B7B">your server</text>
  <rect x="280" y="32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#8A8A98" stroke-width="2"/>
  <text x="304" y="45" font-size="13" fill="#6B6B7B">your app (VTL0)</text>
  <rect x="452" y="32" width="16" height="16" rx="4" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2"/>
  <text x="476" y="45" font-size="13" fill="#6B6B7B">Secure Kernel (VTL1)</text>

  <!-- step 1: server -->
  <g filter="url(#soft)">
    <rect x="130" y="76" width="700" height="52" rx="14" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="102" r="15" fill="#8A6A10"/>
  <text x="162" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="196" y="107" font-size="14.5" fill="#2A2A35">Your server picks a fresh random challenge and sends it over.</text>

  <!-- step 2: app -->
  <g filter="url(#soft)">
    <rect x="130" y="142" width="700" height="52" rx="14" fill="#FFFFFF" stroke="#8A8A98" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="168" r="15" fill="#6B6B7B"/>
  <text x="162" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="196" y="173" font-size="14.5" fill="#2A2A35">Your app calls the API with that challenge and the reports it wants.</text>

  <!-- step 3: Secure Kernel -->
  <g filter="url(#soft)">
    <rect x="130" y="208" width="700" height="52" rx="14" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="234" r="15" fill="#2E5AA8"/>
  <text x="162" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <text x="196" y="239" font-size="14.5" fill="#2A2A35">The Secure Kernel builds each requested report by its own rules.</text>

  <!-- step 4: Secure Kernel -->
  <g filter="url(#soft)">
    <rect x="130" y="274" width="700" height="52" rx="14" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="300" r="15" fill="#2E5AA8"/>
  <text x="162" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
  <text x="196" y="305" font-size="14.5" fill="#2A2A35">It signs the package, folding in your challenge, and hands it back.</text>

  <!-- step 5: app -->
  <g filter="url(#soft)">
    <rect x="130" y="340" width="700" height="52" rx="14" fill="#FFFFFF" stroke="#8A8A98" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="366" r="15" fill="#6B6B7B"/>
  <text x="162" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
  <text x="196" y="371" font-size="14.5" fill="#2A2A35">Your app sends the signed package up to your server.</text>

  <!-- step 6: server -->
  <g filter="url(#soft)">
    <rect x="130" y="406" width="700" height="52" rx="14" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="432" r="15" fill="#8A6A10"/>
  <text x="162" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">6</text>
  <text x="196" y="437" font-size="14.5" fill="#2A2A35">Your server verifies it with a trusted key and matches the challenge.</text>

  <!-- step 7: server -->
  <g filter="url(#soft)">
    <rect x="130" y="472" width="700" height="52" rx="14" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  </g>
  <circle cx="162" cy="498" r="15" fill="#8A6A10"/>
  <text x="162" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">7</text>
  <text x="196" y="503" font-size="14.5" fill="#2A2A35">If both hold, it checks the reports it needs are there and applies policy.</text>

  <text x="480" y="566" text-anchor="middle" font-size="13" fill="#8A8A98">The fresh challenge stops replay. The trusted public key is what gives the signature meaning.</text>
</svg>
