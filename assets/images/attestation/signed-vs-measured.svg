<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One signature, two kinds of fact</title>
  <desc id="d">Two columns sit under a single Secure Kernel signature. The left column holds facts the Secure Kernel knows first-hand: the hotpatch report's BaseCheckSum and BaseTimeDateStamp, which come from the Microsoft-signed patch it verified, and the driver report's list of drivers, because it validates driver loads when HVCI is on. The right column holds a fact recorded from VTL0: the hotpatch report's BaseImageName, which the Secure Kernel asks the normal kernel for so the output is readable. The signature covers both columns.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="452" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="452" fill="url(#paper)"/>

  <!-- ===== The signed package ===== -->
  <g filter="url(#soft)">
    <rect x="40" y="40" width="880" height="344" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="68" y="82" font-size="17" font-weight="700" fill="#2A2A35">What a signed package tells you</text>

  <rect x="596" y="58" width="296" height="36" rx="18" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  <path d="M616,76 l5,5 l9,-10" fill="none" stroke="#2E5AA8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="81.5" font-size="14.5" font-weight="700" fill="#2E5AA8">One Secure Kernel signature</text>

  <!-- ===== Known first-hand ===== -->
  <rect x="68" y="116" width="404" height="240" rx="14" fill="#E8F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  <text x="92" y="150" font-size="16" font-weight="700" fill="#2E7D4F">Known first-hand by the Secure Kernel</text>

  <rect x="92" y="166" width="356" height="36" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
  <text x="108" y="189.5" font-size="14.5" fill="#2A2A35">Hotpatch: checksum and timestamp</text>
  <text x="92" y="226" font-size="13.5" fill="#6B6B7B">From the Microsoft-signed patch it verified.</text>

  <rect x="92" y="250" width="356" height="36" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
  <text x="108" y="273.5" font-size="14.5" fill="#2A2A35">Driver report: the list of drivers</text>
  <text x="92" y="310" font-size="13.5" fill="#6B6B7B">With HVCI on, it validates driver loads itself.</text>

  <!-- ===== Recorded from VTL0 ===== -->
  <rect x="488" y="116" width="404" height="240" rx="14" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  <text x="512" y="150" font-size="16" font-weight="700" fill="#8A6A10">Recorded from VTL0</text>

  <rect x="512" y="166" width="356" height="36" rx="8" fill="#FFFFFF" stroke="#FFB020" stroke-width="2"/>
  <text x="528" y="189.5" font-size="14.5" fill="#2A2A35">Hotpatch: image name</text>
  <text x="512" y="226" font-size="13.5" fill="#6B6B7B">The Secure Kernel asks the normal kernel for it,</text>
  <text x="512" y="246" font-size="13.5" fill="#6B6B7B">so the output is readable.</text>
  <text x="512" y="286" font-size="14.5" font-weight="700" fill="#8A6A10">A cheat can spoof it.</text>

  <text x="480" y="424" text-anchor="middle" font-size="14" fill="#8A8A98">Build policy on the left column. Treat the right column as a label.</text>
</svg>
