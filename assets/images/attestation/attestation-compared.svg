<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Four kinds of attestation, side by side</title>
  <desc id="d">A comparison of who produces the evidence, what it covers and where it stops. Measured boot: firmware and boot code, recorded in the TPM; covers what loaded during startup; nothing after startup. Linux IMA: the Linux kernel; covers files as they load, including kernel modules; the kernel measures itself, and changes in memory after load are not covered. Enclave attestation: the enclave platform; covers the code inside the enclave; not the state of the OS around it. Runtime Attestation Report: the Secure Kernel; covers the Windows kernel at the time of the request; a snapshot of specific things.</desc>

  <defs>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="500" fill="url(#paper)"/>

  <text x="244" y="46" font-size="14" font-weight="700" letter-spacing="0.6" fill="#6B6B7B">Who produces it</text>
  <text x="446" y="46" font-size="14" font-weight="700" letter-spacing="0.6" fill="#6B6B7B">What it covers</text>
  <text x="668" y="46" font-size="14" font-weight="700" letter-spacing="0.6" fill="#6B6B7B">Where it stops</text>
  <g filter="url(#soft)">
    <rect x="32" y="64" width="896" height="88" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="54" y="112" font-size="17" font-weight="700" fill="#2A2A35">Measured boot</text>
  <text x="244" y="101" font-size="16" fill="#2A2A35">Firmware and boot code,</text>
  <text x="244" y="124" font-size="16" fill="#2A2A35">recorded in the TPM</text>
  <text x="446" y="101" font-size="16" fill="#2A2A35">What loaded</text>
  <text x="446" y="124" font-size="16" fill="#2A2A35">during startup</text>
  <text x="668" y="112" font-size="16" font-weight="700" fill="#C8402F">Nothing after startup</text>

  <g filter="url(#soft)">
    <rect x="32" y="164" width="896" height="88" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="54" y="212" font-size="17" font-weight="700" fill="#2A2A35">Linux IMA</text>
  <text x="244" y="212" font-size="16" fill="#2A2A35">The Linux kernel</text>
  <text x="446" y="201" font-size="16" fill="#2A2A35">Files as they load,</text>
  <text x="446" y="224" font-size="16" fill="#2A2A35">including kernel modules</text>
  <text x="668" y="201" font-size="16" font-weight="700" fill="#C8402F">The kernel measures itself;</text>
  <text x="668" y="224" font-size="16" font-weight="700" fill="#C8402F">no later changes in memory</text>

  <g filter="url(#soft)">
    <rect x="32" y="264" width="896" height="88" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="54" y="312" font-size="17" font-weight="700" fill="#2A2A35">Enclave attestation</text>
  <text x="244" y="312" font-size="16" fill="#2A2A35">The enclave platform</text>
  <text x="446" y="301" font-size="16" fill="#2A2A35">The code inside</text>
  <text x="446" y="324" font-size="16" fill="#2A2A35">the enclave</text>
  <text x="668" y="301" font-size="16" font-weight="700" fill="#C8402F">Not the state of</text>
  <text x="668" y="324" font-size="16" font-weight="700" fill="#C8402F">the OS around it</text>

  <g filter="url(#soft)">
    <rect x="32" y="364" width="896" height="88" rx="14" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <text x="54" y="401" font-size="17" font-weight="700" fill="#2E5AA8">Runtime Attestation</text>
  <text x="54" y="424" font-size="17" font-weight="700" fill="#2E5AA8">Report</text>
  <text x="244" y="412" font-size="16" fill="#2E5AA8">The Secure Kernel</text>
  <text x="446" y="401" font-size="16" fill="#2E5AA8">The Windows kernel</text>
  <text x="446" y="424" font-size="16" fill="#2E5AA8">at the time of the request</text>
  <text x="668" y="401" font-size="16" font-weight="700" fill="#2E5AA8">A snapshot of</text>
  <text x="668" y="424" font-size="16" font-weight="700" fill="#2E5AA8">specific things</text>

  <text x="480" y="478" text-anchor="middle" font-size="14" fill="#8A8A98">The first three are still useful for what they cover.</text>
</svg>
