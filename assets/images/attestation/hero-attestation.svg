<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation Report, Part 1 of 4: The Trust Model</title>
  <desc id="dh">Part 1 of the Windows Runtime Attestation Report series. The large question "Can the kernel lie?" appears in white and red above the series name and the post title, over a strip of report bytes ending in a signature highlighted in green.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#292e37"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.78" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.22" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#35d878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35d878" stop-opacity="0"/>
    </radialGradient>
    <filter id="headlineGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#greenGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#redGlow)"/>

  <!-- thumbnail hook -->
  <text x="600" y="163" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-0.8" filter="url(#headlineGlow)"><tspan fill="#ffffff">CAN THE KERNEL </tspan><tspan fill="#ff746a">LIE?</tspan></text>
  <text x="600" y="260" text-anchor="middle" font-size="34" font-weight="700" fill="#a8d8ff" letter-spacing="1.4">WINDOWS RUNTIME ATTESTATION REPORT</text>
  <text x="600" y="314" text-anchor="middle" font-size="34" font-weight="700" fill="#ffd166" letter-spacing="1.4">PART 1 OF 4</text>
  <text x="600" y="372" text-anchor="middle" font-size="34" font-weight="700" fill="#f4f6f8" letter-spacing="1.4">THE TRUST MODEL</text>


  <!-- signed report strip -->
  <text x="600" y="462" text-anchor="middle" font-size="19" font-weight="600" fill="#c4ccd7" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="0.5">SIGNED BY THE SECURE KERNEL &#183; VTL1</text>
  <g>
