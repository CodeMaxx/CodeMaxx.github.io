<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation Report, PART 1 OF 5: Can the kernel lie?</title>
  <desc id="dh">Part 1 of the Windows Runtime Attestation Report series. Under the large question "Can the kernel lie?", two answers sit side by side. On the left, the normal kernel in VTL0 says "All clean", with no signature and nothing to verify. On the right, the Secure Kernel in VTL1 returns a report whose signature is highlighted in green and cannot be forged.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#292e37"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.27" cy="0.72" r="0.46">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.73" cy="0.72" r="0.46">
      <stop offset="0" stop-color="#35d878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35d878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4554" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b4554" stop-opacity="1"/>
      <stop offset="1" stop-color="#3b4554" stop-opacity="0"/>
    </linearGradient>
    <filter id="headlineGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#redGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#greenGlow)"/>

  <!-- series eyebrow: metadata, deliberately quiet -->
  <text x="600" y="100" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2.6"><tspan fill="#a8d8ff">WINDOWS RUNTIME ATTESTATION REPORT</tspan><tspan dx="14" fill="#55637a">&#183;</tspan><tspan dx="14" fill="#ffd166">PART 1 OF 5</tspan></text>
  <rect x="440" y="128" width="320" height="2" fill="url(#strokeFade)"/>

  <!-- thumbnail hook: glows as a whole, the same as the other heroes in the series -->
  <text x="600" y="240" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-1" filter="url(#headlineGlow)"><tspan fill="#ffffff">CAN THE KERNEL</tspan><tspan dx="26" fill="#ff746a">LIE?</tspan></text>

  <!-- answer one: the normal kernel's word, unsigned -->
  <rect x="140" y="310" width="440" height="240" rx="18" fill="#14171c" fill-opacity="0.78" stroke="#ff746a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="168" y="360" font-size="20" font-weight="600" fill="#9aa8b8" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.6">NORMAL KERNEL &#183; VTL0</text>
  <text x="168" y="448" font-size="58" font-weight="700" fill="#f4f6f8">&#8220;All clean.&#8221;</text>
  <g stroke="#ff746a" stroke-width="3.6" stroke-linecap="round">
    <line x1="170" y1="493" x2="188" y2="511"/>
    <line x1="188" y1="493" x2="170" y2="511"/>
  </g>
  <text x="204" y="511" font-size="24" font-weight="600" fill="#ff9d95">No signature. Nothing to verify.</text>

  <!-- answer two: the Secure Kernel's signed report -->
  <rect x="620" y="310" width="440" height="240" rx="18" fill="#14171c" fill-opacity="0.78" stroke="#68e38e" stroke-opacity="0.6" stroke-width="2"/>
  <text x="648" y="360" font-size="20" font-weight="600" fill="#9aa8b8" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.6">SECURE KERNEL &#183; VTL1</text>
  <g fill="#414d5e">
    <rect x="648" y="404" width="22" height="46" rx="5"/>
    <rect x="675" y="404" width="34" height="46" rx="5"/>
    <rect x="714" y="404" width="18" height="46" rx="5"/>
    <rect x="737" y="404" width="44" height="46" rx="5"/>
    <rect x="786" y="404" width="26" height="46" rx="5"/>
    <rect x="817" y="404" width="30" height="46" rx="5"/>
  </g>
  <g fill="#68e38e" filter="url(#headlineGlow)">
    <rect x="852" y="404" width="28" height="46" rx="5"/>
    <rect x="885" y="404" width="46" height="46" rx="5"/>
    <rect x="936" y="404" width="34" height="46" rx="5"/>
    <rect x="975" y="404" width="40" height="46" rx="5"/>
  </g>
  <polyline points="650,503 658,511 673,494" fill="none" stroke="#68e38e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="684" y="511" font-size="24" font-weight="600" fill="#8eeaa9">Signed in VTL1. Can't be forged.</text>
</svg>
