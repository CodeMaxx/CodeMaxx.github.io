<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation: a hacked kernel can lie, but it cannot forge this report</title>
  <desc id="dh">On a dark background, the series brand "Ask the Kernel" sits above the descriptor "The Windows Runtime Attestation Report". Two large lines read "A hacked kernel can lie." and "It can't forge this report." A badge notes the report is signed by the Secure Kernel in VTL1.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3f"/>
      <stop offset="1" stop-color="#12376e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="96" text-anchor="middle" font-size="24" font-weight="700" fill="#7fb0ff" letter-spacing="3">ASK THE KERNEL</text>
  <text x="600" y="150" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">The Windows Runtime Attestation Report</text>

  <text x="600" y="332" text-anchor="middle" font-size="62" font-weight="800" fill="#ff9b8f">A hacked kernel can lie.</text>
  <text x="600" y="414" text-anchor="middle" font-size="62" font-weight="800" fill="#7fe0a0">It can't forge this report.</text>

  <g transform="translate(350,520)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#0f2a56" stroke="#3f6fb5" stroke-width="1.5"/>
    <g transform="translate(48,16)">
      <rect x="0" y="10" width="22" height="17" rx="3" fill="#7fb0ff"/>
      <path d="M3,10 V6.5 a8,8 0 0 1 16,0 V10" fill="none" stroke="#7fb0ff" stroke-width="2.8"/>
      <circle cx="11" cy="18.5" r="2.6" fill="#0f2a56"/>
    </g>
    <text x="92" y="38" font-size="19" font-weight="700" fill="#dce8fb">signed by the Secure Kernel (VTL1)</text>
  </g>
</svg>
