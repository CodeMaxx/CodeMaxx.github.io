      <rect x="294" y="490" width="34" height="30" rx="3"/>
      <rect x="333" y="490" width="18" height="30" rx="3"/>
      <rect x="356" y="490" width="44" height="30" rx="3"/>
      <rect x="405" y="490" width="26" height="30" rx="3"/>
      <rect x="436" y="490" width="30" height="30" rx="3"/>
      <rect x="471" y="490" width="16" height="30" rx="3"/>
      <rect x="492" y="490" width="38" height="30" rx="3"/>
      <rect x="535" y="490" width="28" height="30" rx="3"/>
      <rect x="568" y="490" width="46" height="30" rx="3"/>
      <rect x="619" y="490" width="34" height="30" rx="3"/>
      <rect x="658" y="490" width="20" height="30" rx="3"/>
      <rect x="683" y="490" width="36" height="30" rx="3"/>
