<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation Report, PART 3: What's inside?</title>
  <desc id="dh">Part 3 of the Windows Runtime Attestation Report series. The large question "What's inside?" sits above the post title, "The API and the package". Below, one signed package is drawn as a strip of labelled sections: header, nonce and digests in green, the signature in amber, and the reports in blue.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#292e37"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0.22" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#35d878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35d878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.78" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4da3ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4554" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b4554" stop-opacity="1"/>
      <stop offset="1" stop-color="#3b4554" stop-opacity="0"/>
    </linearGradient>
    <filter id="headlineGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#greenGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- series eyebrow: metadata, deliberately quiet -->
  <text x="600" y="100" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2.6"><tspan fill="#a8d8ff">WINDOWS RUNTIME ATTESTATION REPORT</tspan><tspan dx="14" fill="#55637a">&#183;</tspan><tspan dx="14" fill="#ffd166">PART 3</tspan></text>
  <rect x="440" y="128" width="320" height="2" fill="url(#strokeFade)"/>

  <!-- thumbnail hook -->
  <text x="600" y="270" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-1.2" filter="url(#headlineGlow)"><tspan fill="#ffffff">WHAT'S</tspan><tspan dx="30" fill="#a8d8ff">INSIDE?</tspan></text>

  <!-- post title -->
  <text x="600" y="372" text-anchor="middle" font-size="42" font-weight="700" fill="#f4f6f8" letter-spacing="1.6">THE API AND THE PACKAGE</text>

  <!-- the package, section by section -->
  <text x="600" y="462" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa8b8" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.4">ONE SIGNED PACKAGE</text>
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1">
    <g fill="#68e38e">
      <rect x="140" y="484" width="150" height="44" rx="6"/>
      <rect x="298" y="484" width="118" height="44" rx="6"/>
      <rect x="424" y="484" width="150" height="44" rx="6"/>
    </g>
    <rect x="582" y="484" width="176" height="44" rx="6" fill="#ffc33d" filter="url(#headlineGlow)"/>
    <rect x="766" y="484" width="294" height="44" rx="6" fill="#a8d8ff"/>
    <g fill="#101216">
      <text x="215" y="512">HEADER</text>
      <text x="357" y="512">NONCE</text>
      <text x="499" y="512">DIGESTS</text>
      <text x="670" y="512">SIGNATURE</text>
      <text x="913" y="512">REPORTS</text>
    </g>
  </g>
  <rect x="267" y="548" width="666" height="2" fill="url(#strokeFade)"/>
</svg>
