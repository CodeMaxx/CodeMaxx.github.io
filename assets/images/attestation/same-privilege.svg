<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Security software and the attacker share the kernel</title>
  <desc id="d">Inside kernel mode, a security driver (anti-cheat, EDR, antivirus) asks the kernel what is loaded. Next to it, an attacker's driver (a cheat or kernel-mode malware) can hide itself and change the answer. A double-headed arrow between the two marks that they run at the same privilege level, so neither is above the other. Below the kernel, user mode holds games and apps, which cannot see into the kernel. Whoever loads first, hides best, or blinds the other wins.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="am" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2A2A35"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="380" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="380" fill="url(#paper)"/>

  <!-- ===== Kernel mode: one zone, two drivers ===== -->
  <rect x="40" y="28" width="880" height="204" rx="16" fill="#2A2A35" opacity="0.05"/>
  <text x="64" y="62" font-size="15" font-weight="700" letter-spacing="0.8" fill="#6B6B7B">Kernel mode</text>

  <g filter="url(#soft)">
    <rect x="64" y="84" width="320" height="120" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="224" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#2A2A35">Security driver</text>
  <text x="224" y="142" text-anchor="middle" font-size="13" fill="#6B6B7B">anti-cheat, EDR, antivirus</text>
  <text x="224" y="176" text-anchor="middle" font-size="13.5" fill="#2A2A35">asks the kernel what is loaded</text>

  <g filter="url(#soft)">
    <rect x="576" y="84" width="320" height="120" rx="16" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  </g>
  <text x="736" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#C8402F">Attacker's driver</text>
  <text x="736" y="142" text-anchor="middle" font-size="13" fill="#6B6B7B">cheat or kernel-mode malware</text>
  <text x="736" y="176" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C8402F">can hide itself and change the answer</text>

  <!-- ===== Neither driver is above the other ===== -->
  <line x1="396" y1="144" x2="564" y2="144" stroke="#2A2A35" stroke-width="2.5" marker-start="url(#am)" marker-end="url(#am)"/>
  <text x="480" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2A35">same privilege level</text>

  <!-- ===== User mode ===== -->
  <rect x="40" y="252" width="880" height="60" rx="16" fill="#2A2A35" opacity="0.05"/>
  <text x="64" y="287" font-size="15" font-weight="700" letter-spacing="0.8" fill="#6B6B7B">User mode</text>
  <text x="480" y="286.5" text-anchor="middle" font-size="13" fill="#6B6B7B">games and apps: cannot see into the kernel</text>

  <text x="480" y="354" text-anchor="middle" font-size="13" fill="#8A8A98">Whoever loads first, hides best, or blinds the other wins.</text>
</svg>
