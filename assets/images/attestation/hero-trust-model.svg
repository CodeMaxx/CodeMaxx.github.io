<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="th dh">
  <title id="th">Windows Runtime Attestation Report, PART 2: Who holds the key?</title>
  <desc id="dh">Part 2 of the Windows Runtime Attestation Report series. The large question "Who holds the key?" sits above the post title, "The trust model". Below, a strip is split by a dashed line marking the hypervisor boundary. On the left, the normal kernel in VTL0 is shown as plain grey blocks. On the right, the Secure Kernel in VTL1 holds a glowing green key.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#292e37"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.22" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.78" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#35d878" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#35d878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4554" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b4554" stop-opacity="1"/>
      <stop offset="1" stop-color="#3b4554" stop-opacity="0"/>
    </linearGradient>
    <filter id="headlineGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#redGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#greenGlow)"/>

  <!-- series eyebrow: metadata, deliberately quiet -->
  <text x="600" y="100" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2.6"><tspan fill="#a8d8ff">WINDOWS RUNTIME ATTESTATION REPORT</tspan><tspan dx="14" fill="#55637a">&#183;</tspan><tspan dx="14" fill="#ffd166">PART 2</tspan></text>
  <rect x="440" y="128" width="320" height="2" fill="url(#strokeFade)"/>

  <!-- thumbnail hook -->
  <text x="600" y="270" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="80" font-weight="900" letter-spacing="-1.2" filter="url(#headlineGlow)"><tspan fill="#ffffff">WHO HOLDS THE</tspan><tspan dx="28" fill="#68e38e">KEY?</tspan></text>

  <!-- post title -->
  <text x="600" y="372" text-anchor="middle" font-size="42" font-weight="700" fill="#f4f6f8" letter-spacing="1.6">THE TRUST MODEL</text>

  <!-- the two worlds -->
  <text x="375" y="462" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa8b8" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.4">NORMAL KERNEL &#183; VTL0</text>
  <text x="825" y="462" text-anchor="middle" font-size="18" font-weight="600" fill="#9aa8b8" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.4">SECURE KERNEL &#183; VTL1</text>

  <g fill="#414d5e">
    <rect x="210" y="488" width="22" height="36" rx="4"/>
    <rect x="237" y="488" width="34" height="36" rx="4"/>
    <rect x="276" y="488" width="18" height="36" rx="4"/>
    <rect x="299" y="488" width="44" height="36" rx="4"/>
    <rect x="348" y="488" width="26" height="36" rx="4"/>
    <rect x="379" y="488" width="30" height="36" rx="4"/>
    <rect x="414" y="488" width="16" height="36" rx="4"/>
    <rect x="435" y="488" width="38" height="36" rx="4"/>
    <rect x="478" y="488" width="28" height="36" rx="4"/>
    <rect x="511" y="488" width="29" height="36" rx="4"/>
  </g>

  <!-- the hypervisor boundary -->
  <line x1="600" y1="444" x2="600" y2="548" stroke="#ffc33d" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>

  <!-- the signing key, on the secure side only -->
  <g fill="none" stroke="#68e38e" stroke-width="7" stroke-linecap="round" filter="url(#headlineGlow)">
    <circle cx="684" cy="506" r="16"/>
    <line x1="700" y1="506" x2="776" y2="506"/>
    <line x1="752" y1="506" x2="752" y2="524"/>
    <line x1="776" y1="506" x2="776" y2="521"/>
  </g>
  <g fill="#68e38e" filter="url(#headlineGlow)">
    <rect x="812" y="488" width="28" height="36" rx="4"/>
    <rect x="845" y="488" width="46" height="36" rx="4"/>
    <rect x="896" y="488" width="34" height="36" rx="4"/>
    <rect x="935" y="488" width="40" height="36" rx="4"/>
  </g>

  <text x="600" y="586" text-anchor="middle" font-size="16" font-weight="600" fill="#ffd166" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.4">HYPERVISOR BOUNDARY</text>
</svg>
