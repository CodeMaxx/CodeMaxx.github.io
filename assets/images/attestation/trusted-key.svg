<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Why the server must already trust the key</title>
  <desc id="d">Two versions of the same attack. In both, a compromised machine makes its own key pair and signs a fake report. In the first, the server accepts whatever public key arrives with the package, so the signature checks out and proves nothing. In the second, the server already trusts the Secure Kernel's key, so the fake report does not verify.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="am" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2A2A35"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="420" fill="url(#paper)"/>

  <!-- ===== The server takes the key that arrives with the package ===== -->
  <text x="40" y="50" font-size="15.5" font-weight="700" fill="#C8402F">If the server accepts whatever key arrives with the package</text>

  <g filter="url(#soft)">
    <rect x="40" y="66" width="400" height="92" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
    <rect x="520" y="66" width="400" height="92" rx="14" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  </g>
  <text x="240" y="104" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A2A35">Compromised machine</text>
  <text x="240" y="130" text-anchor="middle" font-size="14" fill="#6B6B7B">makes its own key pair and signs a fake report</text>
  <text x="720" y="104" text-anchor="middle" font-size="15.5" font-weight="700" fill="#C8402F">Server</text>
  <text x="720" y="130" text-anchor="middle" font-size="14" fill="#2A2A35">The signature checks out, and proves nothing.</text>
  <line x1="448" y1="112" x2="512" y2="112" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#am)"/>

  <!-- ===== The server already trusts the real key ===== -->
  <text x="40" y="222" font-size="15.5" font-weight="700" fill="#2E7D4F">If the server already trusts the Secure Kernel's key</text>

  <g filter="url(#soft)">
    <rect x="40" y="238" width="400" height="92" rx="14" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
    <rect x="520" y="238" width="400" height="92" rx="14" fill="#E8F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  </g>
  <text x="240" y="276" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A2A35">Compromised machine</text>
  <text x="240" y="302" text-anchor="middle" font-size="14" fill="#6B6B7B">makes its own key pair and signs a fake report</text>
  <text x="720" y="276" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2E7D4F">Server</text>
  <text x="720" y="302" text-anchor="middle" font-size="14" fill="#2A2A35">The fake doesn't verify against the trusted key.</text>
  <line x1="448" y1="284" x2="512" y2="284" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#am)"/>

  <text x="480" y="388" text-anchor="middle" font-size="14" fill="#8A8A98">The attack is the same in both rows. Only the server's starting point differs.</text>
</svg>
