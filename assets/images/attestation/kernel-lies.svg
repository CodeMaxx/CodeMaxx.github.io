<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two answers to the same question</title>
  <desc id="d">The same question, "is anything loaded that shouldn't be?", is asked twice. The hacked normal kernel in VTL0 answers "all clean", but it may be the compromised thing answering. The Secure Kernel in VTL1 answers with a signed report the hacked kernel cannot forge.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="420" fill="url(#paper)"/>

  <text x="480" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#2A2A35">"Is anything loaded that shouldn't be?"</text>

  <!-- ===== Left: the hacked kernel ===== -->
  <g filter="url(#soft)">
    <rect x="50" y="82" width="390" height="270" rx="16" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  </g>
  <text x="245" y="117" text-anchor="middle" font-size="16.5" font-weight="700" fill="#C8402F">Ask the hacked kernel</text>
  <text x="245" y="140" text-anchor="middle" font-size="12.5" fill="#6B6B7B">VTL0, possibly compromised</text>
  <rect x="92" y="162" width="306" height="88" rx="12" fill="#FFFFFF" stroke="#E8503A" stroke-width="2"/>
  <text x="245" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#2A2A35">"All clean."</text>
  <g transform="translate(228,270)">
    <path d="M17,0 L34,30 L0,30 Z" fill="none" stroke="#C8402F" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="15.5" y="10" width="3" height="12" rx="1.5" fill="#C8402F"/>
    <circle cx="17" cy="26" r="1.8" fill="#C8402F"/>
  </g>
  <text x="245" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C8402F">the attacker is the one answering</text>

  <!-- ===== Right: the Secure Kernel ===== -->
  <g filter="url(#soft)">
    <rect x="520" y="82" width="390" height="270" rx="16" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <text x="715" y="117" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2E5AA8">Ask the Secure Kernel</text>
  <text x="715" y="140" text-anchor="middle" font-size="12.5" fill="#6B6B7B">VTL1, out of the attacker's reach</text>
  <rect x="562" y="162" width="306" height="88" rx="12" fill="#FFFFFF" stroke="#3E8FBF" stroke-width="2"/>
  <g transform="translate(622,189)">
    <rect x="0" y="14" width="26" height="20" rx="4.5" fill="#2E5AA8"/>
    <path d="M4.2,14 V9.5 a8.8,8.8 0 0 1 17.6,0 V14" fill="none" stroke="#2E5AA8" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="13" cy="24" r="3" fill="#FFFFFF"/>
  </g>
  <text x="739" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2A35">a signed report</text>
  <text x="739" y="228" text-anchor="middle" font-size="13.5" fill="#6B6B7B">facts + a signature</text>
  <text x="715" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5AA8">it can't fake this signature</text>

  <text x="480" y="394" text-anchor="middle" font-size="13" fill="#8A8A98">The Secure Kernel signs its answer so your server can verify it.</text>
</svg>
