<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The VBS trust boundary and the courier</title>
  <desc id="d">A dashed boundary separates VTL0, the normal world, from VTL1, the secure world. The Secure Kernel in VTL1 holds a private signing key that VTL0 never sees. The normal world acts as a courier: it can carry a signed package across the boundary, read it, or drop it, but it cannot rewrite it and reproduce the signature.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="452" fill="#FBF7F1"/>
  <rect x="0" y="0" width="960" height="452" fill="url(#paper)"/>

  <!-- secure side gets a faint tint so the two worlds read apart -->
  <rect x="480" y="52" width="456" height="348" rx="16" fill="#EAF6FB" opacity="0.55"/>

  <!-- ===== The boundary ===== -->
  <line x1="480" y1="52" x2="480" y2="400" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="384" y="24" width="192" height="32" rx="16" fill="#FFF6E0" stroke="#FFB020" stroke-width="2.5"/>
  <text x="480" y="45" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="0.6" fill="#8A6A10">VBS trust boundary</text>

  <text x="40" y="88" font-size="15" font-weight="700" letter-spacing="0.8" fill="#6B6B7B">VTL0: normal world</text>
  <text x="920" y="88" text-anchor="end" font-size="15" font-weight="700" letter-spacing="0.8" fill="#2E5AA8">VTL1: secure world</text>

  <!-- ===== The normal world, acting as courier ===== -->
  <g filter="url(#soft)">
    <rect x="60" y="112" width="336" height="152" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <text x="228" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#2A2A35">The normal world (VTL0)</text>
  <text x="228" y="170" text-anchor="middle" font-size="13" fill="#6B6B7B">the courier (may be owned)</text>
  <text x="228" y="206" text-anchor="middle" font-size="13.5" fill="#2A2A35">can carry it without being trusted</text>
  <text x="228" y="230" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C8402F">can't rewrite it and keep the signature</text>

  <!-- ===== The Secure Kernel and its key ===== -->
  <g filter="url(#soft)">
    <rect x="564" y="112" width="336" height="152" rx="16" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2.5"/>
  </g>
  <text x="732" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#2E5AA8">The Secure Kernel</text>
  <text x="732" y="170" text-anchor="middle" font-size="13" fill="#6B6B7B">signs every package it hands out</text>
  <g transform="translate(714,186)" fill="none" stroke="#2E5AA8" stroke-width="3" stroke-linecap="round">
    <circle cx="8" cy="14" r="6.5"/>
    <line x1="14.5" y1="14" x2="35" y2="14"/>
    <line x1="29" y1="14" x2="29" y2="20.5"/>
    <line x1="35" y1="14" x2="35" y2="19.5"/>
  </g>
  <text x="732" y="230" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5AA8">holds a private key VTL0 never sees</text>

  <!-- ===== The signed package, sitting on the boundary ===== -->
  <g filter="url(#soft)">
    <rect x="438" y="292" width="84" height="60" rx="8" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <g transform="translate(438,292)">
    <g stroke="#8A8A98" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
      <line x1="13" y1="16" x2="71" y2="16"/>
      <line x1="13" y1="28" x2="71" y2="28"/>
      <line x1="13" y1="40" x2="46" y2="40"/>
    </g>
    <circle cx="63" cy="45" r="10" fill="#EAF6FB" stroke="#3E8FBF" stroke-width="2"/>
    <path d="M58,45 l4,4 l7,-8" fill="none" stroke="#2E5AA8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="424" y="326.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#2A2A35">a signed package</text>

  <text x="480" y="428" text-anchor="middle" font-size="13" fill="#8A8A98">The package is protected from forgery, not from being read.</text>
</svg>
