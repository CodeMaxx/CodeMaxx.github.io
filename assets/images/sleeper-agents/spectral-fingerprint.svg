<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 46 845 287" width="845" height="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How weight space detection works</title>
  <desc id="d">The detector reads the adapter file alone, with no model run and no need to know the trigger. Q, K, V and O are the four weight matrices a LoRA adapter edits inside every attention block, and the detector takes five numbers from each: how big the change is, how much of it sits in a single direction, and how uneven the individual weights are. That gives a grid of twenty numbers, shown here as four rows of five. A classifier trained on clean adapters scores the grid and flags this adapter as poisoned.</desc>

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2A2A35" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2A35" fill-opacity="0.05"/>
    </pattern>
    <marker id="mInk" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#2A2A35"/>
    </marker>
  </defs>

  <rect x="-15" y="46" width="845" height="287" fill="#FBF7F1"/>
  <rect x="-15" y="46" width="845" height="287" fill="url(#paper)"/>

  <!-- ===== 1. the file alone ===== -->
  <g filter="url(#soft)">
    <rect x="40" y="80" width="150" height="160" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <g stroke="#2A2A35" stroke-width="2.5">
    <rect x="81" y="138" width="68" height="44" rx="7" fill="#DCE3EC"/>
    <rect x="89" y="146" width="52" height="14" rx="3" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <rect x="97" y="170" width="12" height="4" rx="2" fill="#2A2A35" stroke="none" opacity="0.35"/>
    <rect x="121" y="170" width="12" height="4" rx="2" fill="#2A2A35" stroke="none" opacity="0.35"/>
  </g>
  <text x="115" y="272" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#2A2A35">THE ADAPTER FILE</text>
  <text x="115" y="297" text-anchor="middle" font-size="15.5" fill="#4F4F5C">no model run, no trigger</text>

  <line x1="202" y1="160" x2="226" y2="160" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#mInk)"/>

  <!-- ===== 2. five numbers from each weight matrix ===== -->
  <g filter="url(#soft)">
    <rect x="238" y="80" width="300" height="160" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <g font-size="15" font-weight="700" fill="#55555F" text-anchor="middle">
    <text x="282" y="133">Q</text>
    <text x="282" y="161">K</text>
    <text x="282" y="189">V</text>
    <text x="282" y="217">O</text>
  </g>
  <g stroke="#9FB2C9" stroke-width="1.4">
    <rect x="302" y="118" width="34" height="20" rx="4" fill="#DCE3EC"/>
    <rect x="344" y="118" width="34" height="20" rx="4" fill="#CBD8E8"/>
    <rect x="386" y="118" width="34" height="20" rx="4" fill="#F7B7AA"/>
    <rect x="428" y="118" width="34" height="20" rx="4" fill="#D3DDEA"/>
    <rect x="470" y="118" width="34" height="20" rx="4" fill="#BCCDE1"/>

    <rect x="302" y="146" width="34" height="20" rx="4" fill="#CBD8E8"/>
    <rect x="344" y="146" width="34" height="20" rx="4" fill="#D3DDEA"/>
    <rect x="386" y="146" width="34" height="20" rx="4" fill="#DCE3EC"/>
    <rect x="428" y="146" width="34" height="20" rx="4" fill="#BCCDE1"/>
    <rect x="470" y="146" width="34" height="20" rx="4" fill="#FFA48E"/>

    <rect x="302" y="174" width="34" height="20" rx="4" fill="#F7B7AA"/>
    <rect x="344" y="174" width="34" height="20" rx="4" fill="#BCCDE1"/>
    <rect x="386" y="174" width="34" height="20" rx="4" fill="#D3DDEA"/>
    <rect x="428" y="174" width="34" height="20" rx="4" fill="#DCE3EC"/>
    <rect x="470" y="174" width="34" height="20" rx="4" fill="#CBD8E8"/>

    <rect x="302" y="202" width="34" height="20" rx="4" fill="#D3DDEA"/>
    <rect x="344" y="202" width="34" height="20" rx="4" fill="#FFA48E"/>
    <rect x="386" y="202" width="34" height="20" rx="4" fill="#CBD8E8"/>
    <rect x="428" y="202" width="34" height="20" rx="4" fill="#F7B7AA"/>
    <rect x="470" y="202" width="34" height="20" rx="4" fill="#DCE3EC"/>
  </g>
  <text x="388" y="272" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#2A2A35">MEASURE THE WEIGHT CHANGES</text>
  <text x="388" y="297" text-anchor="middle" font-size="15.5" fill="#4F4F5C">Q, K, V, O are the four weight matrices it edits</text>

  <line x1="550" y1="160" x2="574" y2="160" stroke="#2A2A35" stroke-width="2.5" marker-end="url(#mInk)"/>

  <!-- ===== 3. the verdict ===== -->
  <g filter="url(#soft)">
    <rect x="586" y="80" width="190" height="160" rx="16" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2.5"/>
  </g>
  <rect x="611" y="137" width="140" height="46" rx="12" fill="#FBDDD6" stroke="#E8503A" stroke-width="2.5"/>
  <text x="681" y="169" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.2" fill="#C8402F">POISONED</text>
  <text x="681" y="272" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#2A2A35">A CLASSIFIER DECIDES</text>
  <text x="681" y="297" text-anchor="middle" font-size="15.5" fill="#4F4F5C">trained on clean adapters</text>
</svg>


